name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -v

  audit:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install . pip-audit
      # Audit the installed dependencies, leaving out spot2ytm itself (not on PyPI).
      - run: pip freeze --exclude spot2ytm > requirements-audit.txt
      - run: pip-audit --strict --desc on --no-deps --disable-pip -r requirements-audit.txt

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t spot2ytm:ci .
      - name: Smoke test
        run: |
          docker run -d --name s2y -p 127.0.0.1:8000:8000 spot2ytm:ci
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8000/ >/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:8000/ | grep -q "spot2ytm"
          docker rm -f s2y
