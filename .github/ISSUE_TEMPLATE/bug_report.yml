name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! **Never paste your YouTube Music headers, tokens or the contents of the `data/` folder here.**
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect and what happened instead?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Error message or logs
      description: From the page or the terminal. Remove anything that looks like a token or cookie.
      render: text
  - type: input
    id: version
    attributes:
      label: spot2ytm version
      description: Shown in the page footer.
      placeholder: "0.1.0"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How do you run it?
      options: [pip / source, Docker]
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS and Python version
      placeholder: "Ubuntu 24.04, Python 3.12"
